name: test

on:
  push:
  pull_request:

jobs:
  corpus:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]   # macOS = bash 3.2 + BSD tools
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - run: bash ci/gate-test/run.sh

  self-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: ./
        with:
          base: ${{ github.event.pull_request.base.sha || github.event.before }}
          head: ${{ github.event.pull_request.head.sha || github.sha }}
          exclude: ci/gate-test/fixtures/*
