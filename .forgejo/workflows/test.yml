# Same checks on the Forgejo runner (Linux). No instance hostname anywhere: the
# action is used from this checkout (`uses: ./`).
name: test

on:
  push:
  pull_request:

# Never cancel: each run scans only its own push, so a cancelled run is an
# unscanned push (the fleet's pattern; no group, which would cancel pending runs).
concurrency:
  cancel-in-progress: false

jobs:
  corpus:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash ci/gate-test/run.sh

  self-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: ./
        with:
          base: ${{ github.event.pull_request.base.sha || github.event.before }}
          head: ${{ github.event.pull_request.head.sha || github.sha }}
          exclude: ci/gate-test/fixtures/*
